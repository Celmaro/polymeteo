global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    instance: polymeteo-bot

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  - job_name: "polymeteo"
    static_configs:
      - targets:
          - "bot:8000"
    metrics_path: /metrics
    scheme: http
    scrape_timeout: 10s
    scrape_interval: 10s
