name: Deploy to Zeabur

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Zeabur
        uses: zeabur/zeabur-deploy-action@v2
        with:
          token: ${{ secrets.ZEABUR_TOKEN }}

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://polymeteo.zeabur.app/api/health > /dev/null; then
              echo "Service healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i not healthy yet, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1

  notify:
    name: Notify
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        run: |
          echo "Deployment completed successfully"
