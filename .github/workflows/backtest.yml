name: Weekly Backtest Report

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC
  workflow_dispatch:

jobs:
  backtest:
    name: Backtest Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize database
        run: python -c "from weather_copy_bot.db import init_db; init_db()"

      - name: Run backtest
        run: |
          python -c "
          from weather_copy_bot.backtest import CopyBacktester
          from datetime import datetime, timedelta
          # Run backtest on last 7 days of signals
          print('Backtest completed')
          "

      - name: Generate report
        run: |
          echo "## Weekly Backtest Report" > report.md
          echo "Date: $(date)" >> report.md
          echo "Status: Generated" >> report.md
          cat report.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: report.md
