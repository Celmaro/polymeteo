[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-weather-copy-bot"
version = "1.0.0"
description = "Low-latency copy trading bot for Polymarket weather prediction markets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Weather Copy Bot Contributors" }]
keywords = [
  "polymarket",
  "copy-trading",
  "weather",
  "prediction-market",
  "trading-bot",
  "backtest",
  "paper-trading",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "python-dotenv>=1.0.1",
  "orjson>=3.10.0",
  "rich>=13.9.0",
  "typer>=0.12.0",
  "websockets>=13.0",
  "prometheus-client>=0.19.0",
  "sentry-sdk>=2.0.0",
  "aiofiles>=24.1.0",
  "sqlalchemy>=2.0.0",
  "strawberry-graphql[fastapi]>=0.220.0",
  "polymarket-apis>=2.3.0",
  # ML/analytics stack; Dockerfile pins the CPU-only torch build
  "torch>=2.4.0",
  "sentence-transformers>=2.7.0",
  "duckdb>=0.9.0",
  "pyarrow>=14.0.0",
  # Web3/EIP-712 signing (live trading)
  "eth-account>=0.9.0",
  "web3>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.1.0",
  "mypy>=1.8.0",
]

[project.scripts]
weather-copy = "weather_copy_bot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
  "-ra",
  "--strict-markers",
  "--tb=short",
]
markers = [
  "slow: marks tests as slow",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
show_missing = true

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_shadow = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
target-version = "py310"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "C4",
  "DTZ",
  "T10",
  "ISC",
  "PIE",
  "RET",
  "SIM",
  "PERF",
  "RUF",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "B011"]
